      #ports:
      #- "27017:27017"
      #volumes:
      #- mongodb-data:/data/db
    #restart: unless-stopped
      #networks:
      #- ioteste-net


networks:
  ioteste-net:
    driver: bridge

volumes:
  mosquitto-data:
  mosquitto-log:
  #mongodb-data: