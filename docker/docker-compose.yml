services:
  mongodb:
    image: mongo:8
    container_name: ioteste-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - ioteste-net

  control:
    build:
      context: ..
      dockerfile: docker/control.Dockerfile
    container_name: ioteste-control
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017
      SPRING_DATA_MONGODB_DATABASE: ${MONGODB_DATABASE:-ioteste}
      IOTESTE_API_KEY: ${IOTESTE_API_KEY:?Definir IOTESTE_API_KEY en .env}
      ECOWARM_ENVIRONMENT_URL: http://host.docker.internal:9090
      ECOWARM_PUBLIC_URL: http://localhost:8080
      ECOWARM_LABEL: grupo-1
      ECOWARM_ENVIRONMENT_KEY: ${ECOWARM_ENVIRONMENT_KEY:-}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - ioteste-net

networks:
  ioteste-net:
    driver: bridge

volumes:
  mongodb-data: