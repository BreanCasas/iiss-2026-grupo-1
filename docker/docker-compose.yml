services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ioteste-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped
    networks:
      - ioteste-net

  subscriber:
    build:
      context: ..
      dockerfile: Dockerfile
      target: subscriber
    container_name: ioteste-subscriber
    depends_on:
      - mosquitto
      - switch-stub
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_TOPIC: "+/status/#"
      MQTT_CLIENT_ID: ioteste-subscriber
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      SWITCH_STUB_URL: http://switch-stub:8081
    restart: unless-stopped
    networks:
      - ioteste-net

  generator:
    build:
      context: ..
      dockerfile: Dockerfile
      target: generator
    container_name: ioteste-generator
    depends_on:
      - mosquitto
      - subscriber
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_CLIENT_ID: ioteste-generator
      GENERATOR_INTERVAL_MS: 10000
    restart: unless-stopped
    networks:
      - ioteste-net

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    container_name: ioteste-api
    depends_on:
      - switch-stub
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ioteste}
      SWITCH_STUB_URL: http://switch-stub:8081
      IOTESTE_API_KEY: ${IOTESTE_API_KEY}
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - ioteste-net

  switch-stub:
    build:
      context: ..
      dockerfile: Dockerfile
      target: switch-stub
    container_name: ioteste-switch-stub
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - ioteste-net

